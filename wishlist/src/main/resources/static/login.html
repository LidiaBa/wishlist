<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Wish List</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <h1>Вход</h1>

    <form id="login-form">
        <div class="form-group">
            <label>Логин:</label>
            <input type="text" id="login" required>
        </div>
        <div class="form-group">
            <label>Пароль:</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit">Войти</button>
        <p><a href="/register.html">Нет аккаунта? Зарегистрироваться</a></p>
        <div id="error-message" class="error"></div>
    </form>
</div>

<script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        // Очищаем старые ошибки при новой попытке
        document.getElementById('error-message').innerText = '';

        const login = document.getElementById('login').value;
        const password = document.getElementById('password').value;

        try {
            // 1. Отправляем JSON на новый эндпоинт /auth/login
            const response = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: login,
                    password: password
                })
            });

            if (response.ok) {
                // 2. Читаем новый формат ответа (TokenResponse)
                const data = await response.json();

                // 3. Сохраняем токен (теперь он в поле accessToken)
                localStorage.setItem('token', data.accessToken);

                // 4. Сохраняем объект пользователя (он в поле user)
                localStorage.setItem('user', JSON.stringify(data.user));

                // 5. Перекидываем на профиль
                window.location.href = '/profile.html';
            } else {
                document.getElementById('error-message').innerText = 'Неверный логин или пароль';
            }
        } catch (error) {
            console.error('Ошибка:', error);
            document.getElementById('error-message').innerText = 'Ошибка подключения к серверу';
        }
    });
</script>
</body>
</html>
